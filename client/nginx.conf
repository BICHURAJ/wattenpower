# Serves the built React app and forwards /api to the api container, so the
# browser sees one site (the app calls the API with relative /api paths).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Matches the API's 2 MB JSON limit.
  client_max_body_size 2m;

  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Live message stream (Server-Sent Events): pass events straight through
  # and keep the connection open (the API sends a heartbeat every 25 s).
  location = /api/messages/stream {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Built files have content hashes in their names, so they can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Everything else is the app: pages like /installations/123 load index.html,
  # which must never be cached so new releases are picked up.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri /index.html;
  }
}
